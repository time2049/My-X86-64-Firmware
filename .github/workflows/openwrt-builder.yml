#
# File: .github/workflows/openwrt-builder.yml
# Description: Build OpenWrt 25.x (Master)
#

name: My-X86-64-Firmware-25分支云编译-优化版

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

permissions:
  contents: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 480

    steps:
    - name: 1️⃣ 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 2️⃣ 环境初始化
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache build-essential git gawk
        echo "服务器 CPU: $(lscpu | grep 'Model name' | cut -d: -f2 | xargs)"
        df -h

    - name: 3️⃣ 克隆源码
      run: |
        git clone --depth 1 --branch $REPO_BRANCH $REPO_URL openwrt

    - name: 4️⃣ 加载自定义 feeds 和配置
      run: |
        # 移动 feeds 配置
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        cd openwrt
        # 执行 diy-part1
        chmod +x ../$DIY_P1_SH && ../$DIY_P1_SH
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
        # 移动 .config
        [ -e ../$CONFIG_FILE ] && mv ../$CONFIG_FILE .config
        # 执行 diy-part2
        chmod +x ../$DIY_P2_SH && ../$DIY_P2_SH
        
        # 强制配置
        sed -i 's/CONFIG_SIGNED_PACKAGES=y/CONFIG_SIGNED_PACKAGES=n/g' .config
        sed -i 's/CONFIG_CCACHE=n/CONFIG_CCACHE=y/g' .config || echo "CONFIG_CCACHE=y" >> .config
        make defconfig

    - name: 📢 TG 通知：编译开始
      if: always()
      run: |
        # 使用变量引用，注意把 TELEGRAM_BOT_TOKEN 换成你仓库里实际的名字
        BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
        CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
        MSG="🚀 *OpenWrt 编译开始*%0A📟 设备: X86-64%0A🕒 时间: $(date '+%Y-%m-%d %H:%M:%S')"
        
        curl -s "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
          -d "chat_id=${CHAT_ID}" \
          -d "text=${MSG}" \
          -d "parse_mode=Markdown"
          
    - name: 6️⃣ 编译固件 (排错模式)
      run: |
        cd openwrt
        # -j1 V=s 确保错误信息完整输出
        make -j1 V=s

    - name: 7️⃣ 整理固件
      if: success()
      run: |
        cd openwrt/bin/targets/*/*
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: 8️⃣ 上传固件到 Releases
      if: success()
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: Build_${{ env.FILE_DATE }}
        files: ${{ env.FIRMWARE }}/*

    - name: 📢 TG 通知：编译结果
      if: always()
      run: |
        BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
        CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
        
        if [ "${{ job.status }}" == "success" ]; then
          STATUS="✅ *编译成功！*"
        else
          STATUS="❌ *编译失败，请查阅 Actions 日志*"
        fi
        
        MSG="${STATUS}%0A🕒 时间: $(date '+%Y-%m-%d %H:%M:%S')%0A🔗 详情: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        
        curl -s "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
          -d "chat_id=${CHAT_ID}" \
          -d "text=${MSG}" \
          -d "parse_mode=Markdown"
