name: My-X86-64-Firmware-25分支云编译-优化版

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

permissions:
  contents: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 480

    steps:
    - name: 1️⃣ 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 2️⃣ 环境初始化与清理
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo apt-get update
        sudo apt-get install -y ccache build-essential git gawk jq
        echo "服务器 CPU: $(lscpu | grep 'Model name' | cut -d: -f2 | xargs)"

    - name: 3️⃣ 配置编译缓存
      uses: actions/cache@v4
      with:
        path: |
          openwrt/dl
          ~/.ccache
        key: ${{ runner.os }}-openwrt-cache-${{ hashFiles('feeds.conf.default', '.config') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-cache-

    - name: 4️⃣ 克隆源码与加载配置
      run: |
        echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        rm -rf openwrt
        git clone --depth 1 --branch $REPO_BRANCH $REPO_URL openwrt
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        cd openwrt
        chmod +x ../$DIY_P1_SH && ../$DIY_P1_SH
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        [ -e ../$CONFIG_FILE ] && mv ../$CONFIG_FILE .config
        chmod +x ../$DIY_P2_SH && ../$DIY_P2_SH
        sed -i 's/CONFIG_SIGNED_PACKAGES=y/CONFIG_SIGNED_PACKAGES=n/g' .config
        echo "CONFIG_CCACHE=y" >> .config
        make defconfig

    - name: 📢 TG 通知：编译开始（美化版）
      run: |
        MSG="🚀 *OpenWrt 编译开始*%0A"
        MSG="${MSG}📟 *设备架构:* \`X86-64\`%0A"
        MSG="${MSG}🌿 *源码分支:* \`${{ env.REPO_BRANCH }}\`%0A"
        MSG="${MSG}🆔 *运行 ID:* \`${{ github.run_id }}\`%0A"
        MSG="${MSG}🔗 *Actions 详情:* [点击查看](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})%0A"
        MSG="${MSG}🕒 *开始时间:* $(date '+%Y-%m-%d %H:%M:%S')"
        curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d "chat_id=${TELEGRAM_CHAT_ID}&parse_mode=Markdown&text=$MSG" || true

    - name: 6️⃣ 编译固件
      id: compile
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 7️⃣ 上传固件到 Releases
      if: steps.compile.outputs.status == 'success'
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: Build_${{ env.FILE_DATE }}
        files: openwrt/bin/targets/*/*/*.{img.gz,img,bin}

    - name: 📢 TG 通知：编译结果（美化版）
      if: always()
      run: |
        if [[ "${{ steps.compile.outputs.status }}" == "success" ]]; then
          STATUS_ICON="✅"
          STATUS_TEXT="*编译成功*"
          DOWNLOAD_LINK="📦 *下载固件:* [Releases](${{ github.server_url }}/${{ github.repository }}/releases/tag/Build_${{ env.FILE_DATE }})"
        else
          STATUS_ICON="❌"
          STATUS_TEXT="*编译失败*"
          DOWNLOAD_LINK=""
        fi
        MSG="${STATUS_ICON} ${STATUS_TEXT}%0A"
        MSG="${MSG}📟 *设备架构:* \`X86-64\`%0A"
        MSG="${MSG}🏷️ *版本标识:* \`Build_${{ env.FILE_DATE }}\`%0A"
        if [[ -n "$DOWNLOAD_LINK" ]]; then
          MSG="${MSG}${DOWNLOAD_LINK}%0A"
        fi
        MSG="${MSG}🕒 *完成时间:* $(date '+%Y-%m-%d %H:%M:%S')%0A"
        MSG="${MSG}🔗 *运行详情:* [点击查看](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d "chat_id=${TELEGRAM_CHAT_ID}&parse_mode=Markdown&text=$MSG" || true
