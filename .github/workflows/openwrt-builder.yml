name: OpenWrt 云编译 (J1900 毕业精简版)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

permissions:
  contents: write

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: main
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 深度磁盘空间清理
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h

      - name: 3. 初始化环境
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev jq

      - name: 4. 挂载编译缓存 (ccache & dl)
        uses: actions/cache@v4
        with:
          path: |
            cache/dl
            cache/ccache
          key: ${{ runner.os }}-openwrt-${{ hashFiles('feeds.conf.default', '.config') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-

      - name: 5. TG 通知 (编译开始)
        if: always()
        run: |
          MSG="🚀 OpenWrt 编译开始%0A%0A📦 仓库: ${GITHUB_REPOSITORY}%0A🕒 时间: $(date '+%Y-%m-%d %H:%M:%S')"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MSG"

      - name: 6. 克隆源码与编译
        id: compile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf openwrt-src
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt-src
          cd openwrt-src

          # 建立缓存硬目录映射
          mkdir -p ../cache/dl ../cache/ccache
          ln -sf ../cache/dl dl
          ln -sf ../cache/ccache .ccache

          export CCACHE_DIR="$PWD/.ccache"
          export PATH="/usr/lib/ccache:$PATH"
          ccache -M 3G

          [ -e ../$FEEDS_CONF ] && cp ../$FEEDS_CONF feeds.conf.default
          
          chmod +x ../$DIY_P1_SH && ../$DIY_P1_SH

          ./scripts/feeds update -a && ./scripts/feeds install -a
          
          rm -rf tmp
          [ -e ../$CONFIG_FILE ] && cp ../$CONFIG_FILE .config
          
          # 执行自定义脚本（注入 J1900 功耗补丁与抓取 OpenClash 原生 APK）
          chmod +x ../$DIY_P2_SH && ../$DIY_P2_SH

          # 强行开启 ccache 提速
          sed -i 's/CONFIG_CCACHE=n/CONFIG_CCACHE=y/g' .config || echo 'CONFIG_CCACHE=y' >> .config

          # 生成并校验依赖
          make defconfig || (rm -rf tmp && make defconfig)
          
          df -h
          # 核心多线程编译，若失败则降到单线程输出错误日志
          make -j$(($(nproc)+1)) || make -j1 V=s
          df -h
          
          echo "status=success" >> $GITHUB_OUTPUT

          # 获取设备名与时间戳
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: 7. 上传固件到 Release
        if: steps.compile.outputs.status == 'success'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: Build_${{ env.FILE_DATE }}
          # 🌟 改为更宽泛的文件通配匹配，防止漏掉带有 .efi 或 .tar.gz 格式的全新固件
          files: |
            openwrt-src/bin/targets/x86/64/*.img.gz
            openwrt-src/bin/targets/x86/64/*.img
            openwrt-src/bin/targets/x86/64/*-combined*
            openwrt-src/bin/targets/x86/64/*-rootfs*

      - name: 8. 定期清理旧 Releases (保留最新 5 个)
        if: steps.compile.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 30 | awk 'NR>5 {print $3}' | while read -r tag; do
            echo "Deleting release and tag: $tag"
            gh release delete "$tag" -y --cleanup-tag
          done

      - name: 9. TG 通知 (编译结果)
        if: always()
        run: |
          STATUS=$([[ "${{ steps.compile.outputs.status }}" == "success" ]] && echo "✅ 编译成功" || echo "❌ 编译失败")
          MSG="${STATUS}%0A%0A📦 仓库: ${GITHUB_REPOSITORY}%0A🕒 时间: $(date '+%Y-%m-%d %H:%M:%S')%0A🔗 详情: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MSG"
